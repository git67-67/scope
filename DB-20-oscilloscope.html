<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DB-20 Analog Oscilloscope</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: a fixed 2000 x 1011 front panel scaled to fit, bench modules below it.
   Panel palette is cream instrument enamel with red/orange/green accents; the bench is dark. */
:root{--bg:#15181b;--panel:#1e242a;--ink:#dde0d3;--dim:#8f978f;--line:#384048;--grn:#7dff9b;--led:#ff5a3c;--r:4px;
--fp:#d5d2c3;--fp2:#c8c5b5;--fpd:#bdb9a8;--sil:#1c1e1f;--key:#dcd6c3;--red:#c8372b;--org:#e4531c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;font-size:15px;color-scheme:dark}
body{padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.strip{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;justify-content:space-between;max-width:2000px;margin:0 auto 10px}
.brand{font-size:26px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.brand b{color:#f0c75e}
.brand span{font-size:13px;font-weight:500;letter-spacing:.14em;color:var(--dim);margin-left:12px}
#status{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--grn);min-height:1.2em;max-width:100%}
#status.warn{color:#ffb454}
#fpHost{max-width:2000px;margin:0 auto;overflow-x:auto;overflow-y:hidden;border-radius:12px}
#fpSize{position:relative}
#fp{position:absolute;left:0;top:0;width:2000px;height:1011px;transform-origin:0 0;border-radius:18px;overflow:hidden;user-select:none;-webkit-user-select:none;
 background:linear-gradient(180deg,#dcd9ca,#cfccbd);box-shadow:inset 0 0 0 3px #aaa797,inset 0 0 40px #0002}
.pn{position:absolute;border-radius:14px;background:linear-gradient(180deg,#d9d6c8,#cdcabb);box-shadow:inset 0 0 0 2px #b5b2a2,inset 0 2px 0 #ffffff80}
.bezel{position:absolute;left:25px;top:30px;width:955px;height:790px;border-radius:22px;background:linear-gradient(135deg,#b6b8b2,#9da09a 40%,#c6c7bf);box-shadow:inset 0 0 0 3px #8c8f89,inset 6px 8px 26px #0007,0 0 0 2px #fff3}
.recess{position:absolute;left:146px;top:116px;width:748px;height:606px;border-radius:14px;background:linear-gradient(160deg,#292b2a,#101211);box-shadow:inset 0 0 22px #000,0 1px 0 #fff6}
.crtbox{position:absolute;left:165px;top:135px;width:710px;height:568px}
.crt{position:absolute;inset:0;border-radius:30px/24px;overflow:hidden;background:#020504;box-shadow:inset 0 0 40px #000,0 0 0 4px #0a0c0b}
.crt canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#grat{pointer-events:none}
#crtBox:fullscreen{background:#000;display:grid;place-items:center;width:100%!important;height:100%!important}
#crtBox:fullscreen .crt{position:relative;inset:auto;width:min(100vw,125vh);height:min(80vw,100vh);border-radius:0}
#crtBox:-webkit-full-screen{background:#000;display:grid;place-items:center;width:100%!important;height:100%!important}
#crtBox:-webkit-full-screen .crt{position:relative;inset:auto;width:min(100vw,125vh);height:min(80vw,100vh);border-radius:0}
.crt::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 28% 10%,#ffffff14,#0000 46%),radial-gradient(ellipse at center,#0000 64%,#0007 100%)}
.sil{position:absolute;transform:translate(-50%,-50%);font-weight:600;font-size:17px;letter-spacing:.05em;color:var(--sil);white-space:nowrap;pointer-events:none;line-height:1}
.sil.s{font-size:14px;letter-spacing:.04em}.sil.xs{font-size:12px;letter-spacing:.03em;font-weight:500}.sil.b{font-size:20px;font-weight:700;letter-spacing:.1em}
.sil.l{transform:translate(0,-50%)}.sil.r{transform:translate(-100%,-50%)}
.sil.pat{color:#1b4b8a;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;text-transform:none;letter-spacing:0}
.sil.nm{font-size:15px;letter-spacing:.14em;font-weight:700}
/* knobs */
.fk{position:absolute;border-radius:50%;cursor:ns-resize;touch-action:none;outline:none}
.fk::before{content:"";position:absolute;border-radius:50%}
.fk.grey{background:repeating-conic-gradient(#8f8b80 0 4deg,#6c685f 4deg 8deg);box-shadow:0 5px 10px #0007,inset 0 0 0 2px #3c3a35}
.fk.grey::before{inset:13%;background:radial-gradient(circle at 38% 32%,#a39f93,#76726a 70%);box-shadow:inset 0 0 0 1px #0004}
.fk.grey::after{content:"";position:absolute;left:50%;top:9%;width:3px;height:30%;margin-left:-1.5px;background:#17181a;border-radius:1px}
.fk.green{background:repeating-conic-gradient(#555653 0 5deg,#3f403e 5deg 10deg);box-shadow:0 5px 10px #0008,inset 0 0 0 2px #1d1e1c}
.fk.green::before{inset:12%;background:radial-gradient(circle at 36% 30%,#2fb866,#157a3d 70%,#0e5a2c);box-shadow:inset 0 0 0 1px #0006}
.fk.green::after{content:"";position:absolute;left:50%;top:14%;width:3px;height:26%;margin-left:-1.5px;background:#e9f3e0;border-radius:1px}
.fk.red{background:radial-gradient(circle at 36% 30%,#ff7d48,#d8420f 62%,#9d2a06);box-shadow:0 4px 8px #0008,inset 0 0 0 2px #7a2205}
.fk.red::after{content:"";position:absolute;left:50%;top:12%;width:34%;height:36%;transform:translateX(-50%);background:#fff;clip-path:polygon(50% 0,100% 100%,0 100%)}
.fk.red::before{inset:0;box-shadow:inset 0 0 0 5px #0000}
.fk.ring{background:repeating-conic-gradient(#928e83 0 3deg,#716d64 3deg 6deg);box-shadow:0 6px 12px #0007,inset 0 0 0 3px #45433c;cursor:ns-resize}
.fk.ring::before{inset:9%;border-radius:50%;background:radial-gradient(circle at 40% 34%,#b0ac9f,#85817a 75%);box-shadow:inset 0 0 0 2px #0003}
.fk.ring::after{content:"";position:absolute;left:50%;top:6%;width:5px;height:22%;margin-left:-2.5px;background:#17181a;border-radius:1px}
.fk.trim{background:radial-gradient(circle,#1b1b1b 0 38%,#9a978c 40% 60%,#6d6a62 62%);box-shadow:inset 0 0 0 1px #0007;cursor:ns-resize}
.fk.trim::before{left:46%;top:12%;width:8%;height:38%;border-radius:1px;background:#d9d4c2;box-shadow:none}
.fk:focus-visible{outline:3px solid #1a6dd6;outline-offset:3px}
/* keys */
.key{position:absolute;transform:translate(-50%,-50%);border:1px solid #7f7a69;border-radius:3px;cursor:pointer;
 background:linear-gradient(180deg,#e6e0cd,#cbc4ae);box-shadow:0 5px 0 #8f8a76,0 7px 8px #0005,inset 0 1px 0 #fff9;padding:0;font:inherit}
.key.on{transform:translate(-50%,calc(-50% + 4px));box-shadow:0 1px 0 #8f8a76,inset 0 3px 6px #0005;background:linear-gradient(180deg,#bdb6a1,#cfc8b2)}
.key.on::after{content:"";position:absolute;left:50%;top:5px;width:46%;height:4px;margin-left:-23%;border-radius:2px;background:#2bb35f;box-shadow:0 0 5px #2bb35f}
.key.red{background:linear-gradient(180deg,#e2564a,#b52a1f);border-color:#6a140e}
.key.red.on::after{background:#fff;box-shadow:none;opacity:.8}
.key:focus-visible{outline:3px solid #1a6dd6;outline-offset:2px}
/* levers */
.lv{position:absolute;transform:translate(-50%,-50%);background:#232424;border-radius:4px;box-shadow:inset 0 0 0 1px #000,0 1px 0 #fff8;cursor:pointer}
.lv i{position:absolute;display:block;background:linear-gradient(90deg,#8a8678,#d3cebf 45%,#8a8678);border:1px solid #333;border-radius:3px;box-shadow:0 2px 4px #0007;transition:top .08s,left .08s}
.lvl{position:absolute;transform:translate(0,-50%);cursor:pointer;font-weight:600;font-size:16px;letter-spacing:.05em;color:var(--sil);white-space:nowrap}
.lvl.r{transform:translate(-100%,-50%)}.lvl.c{transform:translate(-50%,-50%)}
.lvl:hover{color:#1a6dd6}
/* lamps, bnc, display */
.lamp{position:absolute;transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50%;background:#4a2b25;box-shadow:inset 0 0 0 2px #1c1c1c,inset 0 2px 3px #0008}
.lamp.sq{border-radius:3px;width:30px;height:20px;background:#223a2a}
.lamp.on{background:#ff4d33;box-shadow:inset 0 0 0 2px #1c1c1c,0 0 12px #ff4d33}
.lamp.on.g{background:#38e07b;box-shadow:inset 0 0 0 2px #1c1c1c,0 0 12px #38e07b}
.lamp.g{background:#21402b}
.lamp.tri{border-radius:0;width:20px;height:14px;background:#4a2b25;clip-path:polygon(50% 0,100% 100%,0 100%);box-shadow:none}
.lamp.tri.dn{clip-path:polygon(0 0,100% 0,50% 100%)}
.lamp.tri.on{background:#ff4d33;box-shadow:none;filter:drop-shadow(0 0 4px #ff4d33)}
.bnc{position:absolute;transform:translate(-50%,-50%);width:84px;height:84px;border-radius:50%;cursor:pointer;
 background:radial-gradient(circle,#2a2a2a 0 14%,#cfcabb 15% 22%,#3a3a3a 23% 30%,#b8b3a5 31% 44%,#6c695f 45% 49%,#d6d1c3 50% 66%,#77746a 67%);box-shadow:0 4px 8px #0007,inset 0 0 0 2px #0003}
.bnc::before,.bnc::after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:#46433d;top:50%;margin-top:-5px}
.bnc::before{left:-3px}.bnc::after{right:-3px}
.bnc.cab{outline:3px solid #1a6dd6;outline-offset:2px}
.bnc:focus-visible{outline:3px solid #1a6dd6;outline-offset:2px}
.jack{position:absolute;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;cursor:pointer;background:radial-gradient(circle,#6a1b17 0 30%,#d9d4c4 32% 52%,#4a4840 54% 60%,#a9a597 62%);box-shadow:0 3px 5px #0006}
.jack.sel{outline:3px solid #1a6dd6;outline-offset:2px}
.seg7{position:absolute;transform:translate(-50%,-50%);width:112px;height:48px;background:#2a1213;border-radius:4px;box-shadow:inset 0 0 8px #000,0 1px 0 #fff9;color:#ff4d33;font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:34px;line-height:48px;text-align:center;letter-spacing:.06em;text-shadow:0 0 9px #ff2a10aa}
.menu{position:absolute;z-index:20;background:#1c2024;color:#e8e8dc;border:1px solid #000;border-radius:6px;padding:6px;display:flex;flex-direction:column;gap:2px;box-shadow:0 8px 24px #000a;min-width:150px}
.menu button{font:600 17px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-align:left;background:#2a3036;color:inherit;border:0;border-radius:3px;padding:6px 10px;cursor:pointer}
.menu button:hover,.menu button.cur{background:#3d6fb3}
.menu h4{margin:2px 4px 4px;font:600 12px 'Barlow Condensed';letter-spacing:.14em;color:#9ba3a8;text-transform:uppercase}
.infobar{max-width:2000px;margin:8px auto 0;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:#bfe8c6;background:#0b0f10;border:1px solid var(--line);border-radius:4px;padding:7px 12px;display:flex;flex-wrap:wrap;gap:2px 22px;min-height:34px}
.infobar #ir{display:flex;flex-wrap:wrap;gap:2px 22px}.infobar b{font-weight:500;color:#fff}
/* bench */
.bench{max-width:2000px;margin:14px auto 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:12px}
.mod{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 12px 12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mod h3{margin:0;font-size:13px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line);padding-bottom:5px;display:flex;justify-content:space-between;gap:8px}
.mod h3 em{font-style:normal;color:#f0c75e}
.wide{grid-column:1/-1}
.row{display:flex;flex-wrap:wrap;gap:12px 10px;align-items:flex-start}
.fld{display:flex;flex-direction:column;gap:3px;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
select,input[type=number]{font-family:'IBM Plex Mono',monospace;font-size:12px;background:#10151a;color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:4px 6px;max-width:100%;text-transform:none;letter-spacing:0;color-scheme:dark}
input[type=number]{width:110px}
.kn{display:flex;flex-direction:column;align-items:center;gap:3px;width:72px;user-select:none;-webkit-user-select:none;touch-action:none;outline:none}
.kn .cap{width:46px;height:46px;border-radius:50%;background:conic-gradient(from 0deg,#d4d6c8,#8d9088 25%,#e2e4d6 50%,#8d9088 75%,#d4d6c8);border:2px solid #0c0f12;box-shadow:0 3px 6px #000a,inset 0 0 0 3px #3a3f44;position:relative;cursor:ns-resize}
.kn .cap::after{content:"";position:absolute;left:50%;top:4px;width:3px;height:13px;margin-left:-1.5px;background:#16191c;border-radius:1px}
.kn:focus-visible .cap{outline:2px solid #f0c75e;outline-offset:2px}
.kn .lb{font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;text-align:center;line-height:1.05}
.kn .kv{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--grn);white-space:nowrap}
.grp{display:inline-flex;border:1px solid #0b0e10;border-radius:4px;overflow:hidden}
.pb{font:inherit;font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;padding:5px 9px;background:#2d343b;color:#a2a9a3;border:0;border-right:1px solid #0b0e10;cursor:pointer}
.pb:last-child{border-right:0}.pb:hover{background:#363e46}.pb.on{background:#cfd2c4;color:#15191c}
.pb:focus-visible{outline:2px solid #f0c75e;outline-offset:-2px}
.pb.big{border:1px solid #0b0e10;border-radius:4px;padding:7px 14px}
.pb.big.on{background:#d8412a;color:#fff}
.hint{font-size:13.5px;color:var(--dim);line-height:1.4;letter-spacing:.02em}.hint b{color:var(--ink);font-weight:600}
.cmp{font-family:'IBM Plex Mono',monospace;font-size:12.5px;line-height:1.7;color:#bfe8c6;background:#0b0f10;border:1px solid var(--line);border-radius:4px;padding:8px 12px;overflow-x:auto;white-space:pre}
.cmp .ok{color:#7dff9b}.cmp .bad{color:#ff9a6a}.cmp .d{color:#8f978f}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="strip">
  <div class="brand">DB-<b>20</b><span>ANALOG OSCILLOSCOPE · AUDIO BAND · GPU PHOSPHOR</span></div>
  <div id="status">Running on internal sources.</div>
</header>
<div id="fpHost"><div id="fpSize"><div id="fp">
  <div class="bezel"></div><div class="recess"></div>
  <div class="crtbox" id="crtBox"><div class="crt" id="crt"><canvas id="gl"></canvas><canvas id="grat"></canvas></div></div>
</div></div></div>
<div class="infobar" id="info"></div>
<section class="bench" id="panel"></section>
<script>
"use strict";
/* ============ constants ============ */
const RING=1<<19, MASK=RING-1;
const VD=[5,2,1,.5,.2,.1,.05,.02,.01,.005];                       // CH I / II volts per div, index 0 = fully CCW
const TD=[.5,.2,.1,.05,.02,.01,.005,.002,.001,.0005,.0002,.0001,5e-5,2e-5,1e-5]; // time per div, CW = faster
const SRC=[['open','open'],['cal02','CAL 0.2 V'],['cal2','CAL 2 V'],['genA','GEN A'],['genB','GEN B'],
           ['micL','MIC L'],['micR','MIC R'],['fileL','FILE L'],['fileR','FILE R']];
const SI={micL:0,micR:1,fileL:2,fileR:3,genA:4,genB:5,cal02:6,cal2:7,open:8};
const DIGITAL={micL:1,micR:1,fileL:1,fileR:1};
const WAVES=['sine','square','triangle','saw','noise'];
const PHOS={
 p31:{n:'P31 green',f:[[.55,1,.7],[.55,1,.7]],s:[[.22,.95,.42],[.22,.95,.42]],tm:1},
 p7:{n:'P7 blue / yellow, long',f:[[.45,.6,1],[.45,.6,1]],s:[[.85,.95,.3],[.85,.95,.3]],tm:3},
 amb:{n:'Amber',f:[[1,.82,.45],[1,.82,.45]],s:[[1,.55,.1],[1,.55,.1]],tm:1.3},
 wht:{n:'P4 white',f:[[.92,.96,1],[.92,.96,1]],s:[[.78,.84,.9],[.78,.84,.9]],tm:.7},
 cod:{n:'Beam-coded (I yellow, II cyan)',f:[[1,.9,.5],[.55,.92,1]],s:[[1,.75,.2],[.25,.8,1]],tm:1}
};
/* ============ instrument state (front-panel positions) ============ */
const S={
 power:true,inten:.5,focus:.7,tr:0,illum:1,phos:'p31',persist:.3,find:false,
 xy:false,ab:false,alt:false,tA:9,tAvar:1,tB:12,
 slopeA:1,slopeB:1,levelA:-4.5,levelB:-4.5,hold:0,delay:2.5,
 single:false,tv:'off',tcpl:'dc',trigAlt:true,ext:false,
 calSel:'1k',xmag:false,xpos:0,tsep:-2,
 chII:false,dual:true,add:false,inv2:false,ch3:false,
 ch:[{vIdx:6,var:1,pos:1.5,cpl:'dc',pull:false},{vIdx:6,var:1,pos:-1.5,cpl:'dc',pull:false},{var:1,pos:0,cpl:'dc'}],
 jack:{i1:'cal02',i2:'genA',i3:'open',trig:'open'},
 gen:[{wave:'sine',f:.6146,a:.55},{wave:'sine',f:.6536,a:.5}],
 mon:{sel:'off',vol:.3}
};
const genHz=v=>Math.pow(10,v*Math.log10(20000));
const genAmp=v=>0.001*Math.pow(5000,v);   // 1 mV .. 5 V peak
function vdiv(i){const c=S.ch[i];
 if(i===2)return .1*(1+1.5*(1-c.var));
 let v=VD[c.vIdx];if(c.pull&&c.vIdx===9)v=.001;return v*(1+1.5*(1-c.var));}
const tdivA=()=>TD[S.tA]*(1+1.5*(1-S.tAvar));
const tdivB=()=>TD[S.tB];
const levelAT=()=>S.levelA<=-4.25, levelFR=()=>S.levelB<=-4.25;
const holdMult=()=>1+9*S.hold;
const TVMODE={off:0,'h+':1,'h-':1,'v+':2,'v-':2};
/* ============ calibration trims (kept per input source) ============ */
const CAL={gain:{},tb:1,when:{}};
try{const j=JSON.parse(localStorage.getItem('db20.cal.v2')||'null');if(j&&j.gain){CAL.gain=j.gain;CAL.tb=j.tb||1;CAL.when=j.when||{};}}catch(e){}
function saveCal(){try{localStorage.setItem('db20.cal.v2',JSON.stringify(CAL));}catch(e){}}
const gainOf=k=>CAL.gain[k]||1;
/* ============ audio / ring state ============ */
const A={ctx:null,proc:null,fs:48000,w:0,mic:false,file:null,fpos:0,fplay:true,virt:0,stream:null};
const fsE=()=>A.fs*CAL.tb;     // effective sample rate after the timebase trim
const R={c1:new Float32Array(RING),c2:new Float32Array(RING),c3:new Float32Array(RING),
         t1:new Float32Array(RING),t2:new Float32Array(RING),tx:new Float32Array(RING)};
const F={ph:[0,0],calPh:0,linePh:0,cx:[0,0,0],cy:[0,0,0],tx:[0,0,0],ty:[0,0,0],tl1:[0,0,0],tl2:[0,0,0],th:[0,0,0],thx:[0,0,0],ex:0,ey:0};
const srcv=new Float32Array(9),raw=new Float32Array(9);
let clipHold=0;
function wf(type,ph){
 switch(type){case 0:return Math.sin(6.283185307179586*ph);case 1:return ph<.5?1:-1;
 case 2:return ph<.5?4*ph-1:3-4*ph;case 3:return 2*ph-1;default:return Math.random()*2-1;}
}
/* ============ ingest: runs on every block of samples, from audio or from the virtual clock ============ */
function ingest(n,inL,inR,outL,outR){
 const fs=A.fs,g=S.gen,c=S.ch,mon=S.mon,mv=mon.vol*mon.vol*2,fl=A.file;
 const gw=[WAVES.indexOf(g[0].wave),WAVES.indexOf(g[1].wave)];
 const gf=[genHz(g[0].f)/fs,genHz(g[1].f)/fs],ga=[genAmp(g[0].a),genAmp(g[1].a)];
 const calF=(S.calSel==='1k'?1000:10000)/fs;
 const J=[SI[S.jack.i1],SI[S.jack.i2],SI[S.jack.i3],SI[S.jack.trig]];
 const gn=[gainOf(S.jack.i1),gainOf(S.jack.i2),gainOf(S.jack.i3),gainOf(S.jack.trig)];
 const hpA=1/(1+6.2832*2/fs),hpT=1/(1+6.2832*20/fs),hpL=1/(1+6.2832*800/fs),hpV=1/(1+6.2832*2000/fs);
 const lpH=1-Math.exp(-6.2832*3000/fs),lpV=1-Math.exp(-6.2832*150/fs);
 const tvm=TVMODE[S.tv],tc=tvm===1?'tvh':tvm===2?'tvv':S.tcpl;
 const useLine=S.tcpl==='line'&&!S.ext;
 let clip=0;
 for(let k=0;k<n;k++){
  raw[0]=inL?inL[k]:0;raw[1]=inR?inR[k]:0;
  if(fl&&A.fplay){const p=A.fpos;raw[2]=fl.l[p];raw[3]=fl.r[p];A.fpos=p+1>=fl.l.length?0:p+1;}else{raw[2]=0;raw[3]=0;}
  let ph=F.ph[0];raw[4]=ga[0]*wf(gw[0],ph);ph+=gf[0];F.ph[0]=ph-Math.floor(ph);
  ph=F.ph[1];raw[5]=ga[1]*wf(gw[1],ph);ph+=gf[1];F.ph[1]=ph-Math.floor(ph);

/* ---- measurement used by the counter and the calibration wizard ---- */
function measure(ring,n){
 const w=A.w;n=Math.min(n,w-16);if(n<1500)return null;
 let mn=1e9,mx=-1e9,sum=0;
 for(let i=0;i<n;i++){const v=ring[(w-1-i)&MASK];if(v<mn)mn=v;if(v>mx)mx=v;sum+=v;}
 const mean=sum/n,r={vpp:mx-mn,mean,f:0,rms:0,cycles:0};
 if(r.vpp<1e-4)return r;
 const hy=r.vpp*.2;let st=0,prev=ring[(w-n)&MASK]-mean;const idx=[];
 for(let i=1;i<n;i++){const v=ring[(w-n+i)&MASK]-mean;
  if(v<-hy)st=1;else if(st===1&&prev<0&&v>=0){idx.push(i-1+(0-prev)/(v-prev));st=0;}prev=v;}
 if(idx.length>=3){
  const pps=[];let sq=0,cnt=0;
  for(let k=0;k<idx.length-1;k++){
   const a=Math.ceil(idx[k]),b=Math.floor(idx[k+1]);let lo=1e9,hi=-1e9;
   for(let i=a;i<=b;i++){const v=ring[(w-n+i)&MASK];if(v<lo)lo=v;if(v>hi)hi=v;sq+=(v-mean)*(v-mean);cnt++;}
   pps.push(hi-lo);
  }
  pps.sort((x,y)=>x-y);r.vpp=pps[pps.length>>1];
  r.f=(idx.length-1)/((idx[idx.length-1]-idx[0])/fsE());r.rms=Math.sqrt(sq/Math.max(1,cnt));r.cycles=idx.length-1;
 }
 return r;
}

 const k=S.jack['i'+(CW.ch+1)],name=SRC.find(s=>s[0]===k)[1],cn=['CH. I','CH. II','CH. III'][CW.ch];
 const mm=measure(RINGS[CW.ch],24000),rf=refValues();
 let h=`<span class="d">${cn} ← ${name}   input trim ×${gainOf(k).toFixed(4)}${CAL.when[k]?' ('+CAL.when[k]+')':''}   timebase trim ${((CAL.tb-1)*1e6).toFixed(0)} ppm</span>\n`;
 if(CW.ref==='fs'){h+='Full-scale entry needs no signal. Enter the voltage that ±1.0 represents and apply.';}
 else if(!mm||mm.vpp<2e-4){h+='<span class="bad">No signal on this channel.</span> Patch the reference or your external source to it.';}
 else{
  const ev=pct(mm.vpp,rf.v),ef=mm.f?pct(mm.f,rf.f):null;
  const cls=Math.abs(ev)<=2?'ok':'bad',fc=ef!=null&&Math.abs(ef)<=.1?'ok':'bad';
  const vd=vdiv(CW.ch);
  h+=`measured  ${fmtV(mm.vpp).padEnd(11)} p-p   ${mm.f?fmtF(mm.f):'no period'}\n`;
  h+=`expected  ${fmtV(rf.v).padEnd(11)} p-p   ${fmtF(rf.f)}\n`;
  h+=`amplitude error <span class="${cls}">${ev>=0?'+':''}${ev.toFixed(2)} %</span>   frequency error <span class="${fc}">${ef==null?'—':(ef>=0?'+':'')+ef.toFixed(3)+' %'}</span>\n`;
  h+=`display   ${(mm.vpp/vd).toFixed(2)} div p-p at ${fmtV(vd)}/div${S.ch[Math.min(CW.ch,2)].var<1||(CW.ch<2&&S.ch[CW.ch].pull)?' (uncalibrated setting)':''}`;
 }
 out.innerHTML=h;
}
/* ============ readout, loop, boot ============ */
let FPK=1,frames=0,tPrev=performance.now();
function updateReadout(){
 const names=['I','II','III'];let h='';
 for(let q=0;q<3;q++){
  if(q===2&&!S.ch3)continue;if(q===1&&!S.dual&&!S.chII&&!S.add)continue;
  const m=measure(RINGS[q],12000);
  h+=`<span><b>${names[q]}</b> ${m?fmtV(m.vpp)+' p-p'+(m.rms?' · '+fmtV(m.rms)+' rms':'')+(m.f?' · '+fmtF(m.f):''):'—'}</span>`;
 }
 h+=`<span>${S.xy?'X-Y':fmtT(tdivA())+'/div'}</span>`;
 h+=`<span>${A.ctx?'fs '+A.fs+' Hz'+(A.mic?' · mic':'')+(A.file?' · '+A.file.name:''):'internal sources'}</span>`;
 if(performance.now()<clipHold)h+='<span style="color:#ff9a6a"><b>INPUT OVERLOAD</b></span>';
 $('ir').innerHTML=h;
 // overscan
 let up=false,dn=false;
 if(!S.xy){const w=A.w;for(const b of new Set(D.groups.flat())){const r=RINGS[b===0&&D.sum?0:b];
  let mn=1e9,mx=-1e9;for(let i=0;i<2048&&i<w;i+=2){const w2=(w-1-i)&MASK;
   const v=b===1?R.c2[w2]*D.g[1]:b===2?R.c3[w2]*D.g[2]:(D.sum?R.c1[w2]*D.g[0]+R.c2[w2]*D.g[1]:R.c1[w2]*D.g[0]);
   if(v<mn)mn=v;if(v>mx)mx=v;}
  if(mx+D.pos[b]>4.05)up=true;if(mn+D.pos[b]<-4.05)dn=true;}}
 D.overUp=up;D.overDn=dn;
}
function fit(){
 const host=$('fpHost'),w=host.clientWidth||(window.innerWidth-32);
 FPK=Math.max(.5,Math.min(1,w/2000));
 fp.style.transform='scale('+FPK+')';$('fpSize').style.width=(2000*FPK)+'px';$('fpSize').style.height=(1011*FPK)+'px';
 resize();
}
/* ---- pop-out screen window and full screen ---- */
function goFull(){
 const e=$('crtBox'),f=e.requestFullscreen||e.webkitRequestFullscreen;
 if(!f){setStatus('This browser does not allow full screen here.',1);return;}
 try{const p=f.call(e);if(p&&p.catch)p.catch(()=>setStatus('Full screen was refused. Try the pop-out window instead.',1));}catch(x){setStatus('Full screen was refused.',1);}
}
function openScreenWindow(){
 if(POP&&!POP.closed){POP.focus();return;}
 const w=window.open('','db20screen','popup=yes,width=1100,height=900');
 if(!w){setStatus('A pop-up window is not allowed here, so the screen went full screen in this window instead.',1);goFull();return;}
 w.document.open();
 w.document.write('<!doctype html><meta charset="utf-8"><title>DB-20 Screen</title><style>html,body{margin:0;height:100%;background:#000;overflow:hidden}body{display:grid;place-items:center}canvas{display:block}#h{position:fixed;left:12px;bottom:10px;font:12px monospace;color:#7fc;opacity:0;transition:opacity .4s;pointer-events:none}body:hover #h{opacity:.75}</style><canvas id="c"></canvas><div id="h">F or double-click: full screen · Esc: leave full screen · R: re-arm single sweep</div>');
 w.document.close();
 POP=w;popCanvas=w.document.getElementById('c');popCtx=popCanvas.getContext('2d');
 const fs=()=>{const d=w.document;if(d.fullscreenElement)d.exitFullscreen();else d.documentElement.requestFullscreen&&d.documentElement.requestFullscreen().catch(()=>{});};
 w.document.addEventListener('dblclick',fs);
 w.document.addEventListener('keydown',e=>{if(e.key==='f'||e.key==='F')fs();else if(e.key==='r'||e.key==='R')arm();});
 w.addEventListener('resize',resize);
 w.addEventListener('pagehide',()=>{POP=null;popCanvas=null;popCtx=null;resize();});
 resize();setStatus('Screen window open. Double-click it or press F for full screen; controls stay in this window.');
}
document.addEventListener('fullscreenchange',()=>setTimeout(()=>{fit();},80));
document.addEventListener('webkitfullscreenchange',()=>setTimeout(()=>{fit();},80));
window.addEventListener('beforeunload',()=>{if(POP&&!POP.closed)POP.close();});
let tok=0;
function sched(){
 const my=++tok,run=()=>{if(tok===my)frame();};
 requestAnimationFrame(run);
 if(POP&&!POP.closed)POP.requestAnimationFrame(run);
}
function frame(){
 const t=performance.now();
 const dt=Math.min(.05,Math.max(.001,(t-tPrev)/1000));tPrev=t;
 if(!A.ctx)virtualTick(dt);
 if(!GLR){sched();return;}
 runEngine();renderGL(dt);
 if(gratDirty||(trigShowUntil&&t>trigShowUntil)){if(trigShowUntil&&t>trigShowUntil)trigShowUntil=0;drawGrat();}
 if(POP&&!POP.closed&&popCtx){
  if(popCanvas.width!==W_PX||popCanvas.height!==H_PX){popCanvas.width=W_PX;popCanvas.height=H_PX;}
  popCanvas.style.width=popCss[0]+'px';popCanvas.style.height=popCss[1]+'px';
  popCtx.drawImage(cv,0,0);popCtx.drawImage(gcv,0,0);
 }
 for(const f of LIVE)f();
 if(++frames%8===0){updateReadout();updateCalOut();}
 sched();
}
(function boot(){
 const ib=$('info');ib.innerHTML='<span id="ik"><b>Hover or drag a control</b> to read its setting.</span><span id="ir"></span>';
 buildFaceplate();buildBench();refreshUI();
 fit();new ResizeObserver(fit).observe($('fpHost'));window.addEventListener('resize',fit);
 try{initGL();allocTargets();gratDirty=true;}catch(e){setStatus('Cannot start the GPU display: '+e.message,1);console.error(e);return;}
 resetEngine();
 window.addEventListener('keydown',e=>{if((e.key==='r'||e.key==='R')&&!/select|input|textarea/i.test(e.target.tagName))arm();});
 setStatus('Running on internal sources: INP. I is patched to the 0.2 V calibrator, INP. II to generator A. Click a BNC jack to patch something else.');
 sched();
})();

</script>
